<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Weather App</h1>
        <form class="search-form" id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Enter city name"
            autocomplete="off"
            required
            class="search-input"
          />
          <input
            type="submit"
            class="search-button"
            value="Search"
            id="search-button"
          />
        </form>
      </header>
      <main>
        <div class="weather-info">
          <div class="weather-details">
            <h2 id="current-city" class="city">San Francisco</h2>
            <p>
              <span id="current-date">Tuesday 14:49</span>,
              <span id="current-description">scattered clouds</span>
              <br />
              Humidity: <span id="current-humidity">66</span>%, Wind:
              <span id="current-wind">3.13</span>km/h
            </p>
          </div>
          <p class="temperature-para">
            <span id="current-temp-img">🌥️</span
            ><span id="current-temperature">12</span><span>&deg;F</span>
          </p>
        </div>
      </main>
      <footer>
        <p>
          Coded by
          <a
            class="footer_link"
            href="https://github.com/TomariCodes"
            target="_blank"
            >Tomari Southern</a
          >, is open-sourced on
          <a
            class="footer_link"
            href="https://github.com/TomariCodes/project-weather"
            target="_blank"
            >GitHub</a
          >
          and website hosted on
          <a
            class="footer_link"
            href="https://mp-weather-app.netlify.app//"
            target="_blank"
            >Netlify</a
          >.
        </p>
      </footer>
    </div>
  </body>
</html>
