<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h2>Weather App</h2>
        <form class="search-form" id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Enter city name"
            autocomplete="off"
            required
            class="search-input"
          />
          <input
            type="submit"
            class="search-button"
            value="Search"
            id="search-button"
          />
        </form>
      </header>
      <main>
        <div class="weather-info">
          <div class="weather-details">
            <h1 id="current-city" class="city"></h1>
            <p>
              <span id="current-date">Tuesday 14:49</span>,
              <span id="current-description">scattered clouds</span>
              <br />
              Humidity: <strong><span id="current-humidity">66</span>%</strong>, Wind:
              <strong><span id="current-wind">3.13</span>km/h</strong>
            </p>
          </div>
          <div class="temperature-container">
            <div class="current-temp-img" id="current-temp-img"><img src="http://shecodes-assets.s3.amazonaws.com/api/weather/icons/rain-day.png" alt="Rain Day"/></div>
            <div class="current-temperature" id="current-temperature">12</div>
            <div class="current-temperature-unit">&deg;F</div>
          </div>
        </div>
      </main>
      <footer>
        <p>
          Coded by
          <a
            class="footer_link"
            href="https://github.com/TomariCodes"
            target="_blank"
            >Tomari Southern</a
          >, is
          <a
            class="footer_link"
            href="https://github.com/TomariCodes/project-weather"
            target="_blank"
          >
            open-sourced on GitHub</a
          >
          and website
          <a
            class="footer_link"
            href="https://mp-weather-app.netlify.app//"
            target="_blank"
            >hosted on Netlify</a
          >.
        </p>
      </footer>
    </div>

    <script src="index.js"></script>
  </body>
</html>
